name: Publish GitHub Package

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: https://npm.pkg.github.com
          scope: '@p-wldz'
      - run: npm ci
      - run: npm run release:version:check
      # GitHub's npm registry accepts scoped packages only. Keep the public npm
      # package name unchanged and scope this CI-only published manifest.
      - run: npm pkg set name=@p-wldz/clipforge
      - run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
