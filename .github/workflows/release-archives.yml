name: Publish portable archives

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run release:version:check
      - run: npm run ci
      - run: npm run release:archive
      - run: npm run release:archive:check
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -C release -czf ../release/${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}.tar.gz clipforge-*
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath release\${{ github.ref_name }}-Windows-${{ runner.arch }}.zip
      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true
          path: release
      - name: Create shared SHA-256 checksums
        run: cd release && sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
